name: Generate message OpenAPI files

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "templates/**"
      - "config/**"
      - "mock_backend/_vendor/**"
      - "pyproject.toml"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: generate-message-openapi-files
  cancel-in-progress: false

jobs:
  generate:
    name: Generate per-message OpenAPI files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OpenAPI repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Install generator and mock backend
        run: python -m pip install -r requirements-dev.txt

      - name: Read source repository configuration
        id: source
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml

          with open("config/generator.yml", encoding="utf-8") as handle:
              source = yaml.safe_load(handle)["source"]
          print(f"repository={source['repository']}")
          print(f"ref={source.get('ref') or 'main'}")
          PY

      - name: Checkout message specifications repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.ref }}
          path: _source/h2-market-message-specifications
          # The secret is only needed while the source repository is private.
          token: ${{ secrets.H2_MARKET_MESSAGES_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Generate OpenAPI files
        run: >-
          python -m h2_openapi_generator generate-all
          --source-root _source/h2-market-message-specifications
          --templates-root templates
          --output-root dist

      - name: Validate generated OpenAPI files
        run: python -m h2_openapi_generator validate-all --output-root dist

      # Commits pushed with the workflow token do not trigger validate.yml, so the
      # regenerated files are checked here before they are committed.
      - name: Run linter
        run: ruff check .

      - name: Run tests against the regenerated files
        run: python -m pytest -q

      - name: Commit regenerated OpenAPI files and validator bundle
        if: github.ref == 'refs/heads/main'
        run: |
          # A changed source commit alone (SOURCE.json) is not worth a commit.
          if [ -z "$(git status --porcelain -- dist/messages mock_backend/_vendor ':(exclude)mock_backend/_vendor/*/SOURCE.json')" ]; then
            echo "No generated OpenAPI or validator changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/messages mock_backend/_vendor
          git commit -m "chore: regenerate message OpenAPI files and validator bundle"
          git push
