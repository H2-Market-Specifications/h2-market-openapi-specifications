name: Validate OpenAPI generator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate generator and fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      # The mock backend must work without the source repository installed.
      - name: Install package and development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Read source repository configuration
        id: source
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml

          with open("config/generator.yml", encoding="utf-8") as handle:
              source = yaml.safe_load(handle)["source"]
          print(f"repository={source['repository']}")
          print(f"ref={source.get('ref') or 'main'}")
          PY

      - name: Checkout message specifications repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.ref }}
          path: _source/h2-market-message-specifications
          # The secret is only needed while the source repository is private.
          token: ${{ secrets.H2_MARKET_MESSAGES_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Run linter
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Verify committed OpenAPI files and validator bundle are current
        run: |
          python -m h2_openapi_generator generate-all \
            --source-root _source/h2-market-message-specifications \
            --templates-root templates \
            --output-root dist
          # SOURCE.json only records the source commit, which changes with every upstream commit.
          changes="$(git status --porcelain -- dist/messages mock_backend/_vendor ':(exclude)mock_backend/_vendor/*/SOURCE.json')"
          if [ -n "$changes" ]; then
            echo "::error::Committed specifications or validator bundle differ from a fresh regeneration (added, changed or deleted files):"
            echo "$changes"
            git diff -- dist/messages mock_backend/_vendor ':(exclude)mock_backend/_vendor/*/SOURCE.json'
            exit 1
          fi

      - name: Verify wheel contents
        run: |
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir _wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path('_wheel').glob('*.whl'))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert 'mock_backend/validation/semantic_validation.py' in names, 'Wheel is missing semantic_validation.py'
          bundle = Path('mock_backend/_vendor/h2_message_validation')
          expected_bundle = {f'{bundle.as_posix()}/{path.name}' for path in bundle.iterdir() if path.is_file()}
          missing_bundle = expected_bundle - names
          assert not missing_bundle, f'Wheel is missing bundled validator files: {sorted(missing_bundle)}'
          source_root = Path('dist/messages')
          expected = {
              f'mock_backend/_openapi/{path.relative_to(source_root).as_posix()}'
              for path in source_root.glob('*/v*/*/openapi.yaml')
          }
          actual = {
              name for name in names
              if name.startswith('mock_backend/_openapi/') and name.endswith('/openapi.yaml')
          }
          assert expected, 'No source OpenAPI documents found'
          assert actual == expected, (
              f'Wheel OpenAPI mismatch: missing={sorted(expected - actual)}, unexpected={sorted(actual - expected)}'
          )
          print(f'Verified {len(actual)} packaged OpenAPI documents')
          PY
