openapi: 3.1.0
info:
  title: H2 VTP Nomination API
  version: 1.0.0
  summary: API specification for submitting VTP nominations and renominations to the hydrogen market area manager for processing, matching where applicable, and allocation.
  description: |-
    This OpenAPI specification describes the HTTP-based submission of nominations and renominations at the virtual
    trading point (VTP/VHP) in the H2 market. Nominations are submitted to the hydrogen market area manager (WMGV) by
    the balancing group responsible party or by the hydrogen market area manager.

    For regular transfers between balancing groups, the balancing group responsible party submits a Double Sided
    Nomination to the hydrogen market area manager (WMGV). The hydrogen market area manager compares the corresponding
    nominations in an automated matching process. Equal quantities are confirmed, different same-direction quantities
    are matched using the lesser rule, and missing or directionally inconsistent counterpart nominations result in zero
    for the affected interval. The VTP process also permits Single Sided Nominations for specifically defined
    contractual or system processes; in those cases no corresponding nomination from another BKV is required, in
    particular for cooperative balancing and the return of difference quantities. Every renomination triggers renewed
    processing. The confirmed result is used for the VTP allocation and therefore enters the balancing-group
    calculation.
x-h2-message:
  id: vtp-nomination
  businessName: VTP Nomination
  type: NOMINATION
  subType: VTP
  messageVersion: '0.9'
  lifecycle: consultation
servers:
- url: /
  description: Local test environment
tags:
- name: VTPNominations
  description: >-
    HTTP operations for submitting nominations and renominations at the virtual trading point.
security:
- mtls: []
paths:
  /api/v1/vtp-nominations:
    post:
      tags:
      - VTPNominations
      summary: Submit VTP nomination or renomination
      description: >-
        With this operation, the balancing group responsible party or the hydrogen market area manager submits a
        nomination or renomination at the virtual trading point (VTP/VHP) to the hydrogen market area manager
        (WMGV). Transfers between balancing groups are generally submitted as Double Sided Nominations (DSN), for
        which corresponding nominations are matched: equal quantities are confirmed, differing same-direction
        quantities are reduced according to the lesser rule, and missing or directionally inconsistent
        counter-nominations result in zero. For specifically defined contractual or system processes, Single Sided
        Nominations (SSN) are also permitted and do not require a corresponding nomination from another BKV; this
        applies in particular to cooperative balancing and the return of difference quantities. Each renomination
        triggers renewed processing, and the confirmed result is used for the VTP allocation in the affected
        balancing groups.
      operationId: submitVTPNominations
      parameters:
      - x-h2-generator:
          inject: common-component
          ref: '#/components/parameters/H2TransactionId'
      - x-h2-generator:
          inject: common-component
          ref: '#/components/parameters/H2InitialTransactionId'
      - x-h2-generator:
          inject: common-component
          ref: '#/components/parameters/H2MessageSender'
      - x-h2-generator:
          inject: common-component
          ref: '#/components/parameters/H2MessageReceiver'
      - $ref: '#/components/parameters/H2BusinessProcess'
      requestBody:
        $ref: '#/components/requestBodies/VTPNominationMessage'
      responses:
        '200':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/TargetSuccess'
        '400':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/BadRequest'
        '401':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/Unauthorized'
        '403':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/Forbidden'
        '404':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/RouteNotFound'
        '405':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/MethodNotAllowed'
        '409':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/TargetConflict'
        '415':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/TargetUnprocessableEntity'
        '429':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/TooManyRequests'
        '502':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/BadGateway'
        '503':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/ServiceUnavailable'
        '504':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/GatewayTimeout'
components:
  securitySchemes:
    mtls:
      x-h2-generator:
        inject: common-component
        $ref: '#/components/securitySchemes/mtls'
  parameters:
    H2BusinessProcess:
      name: H2-Business-Process
      in: header
      required: true
      description: >-
        Identifies the business process to which this API call belongs. For this operation, the permitted value is
        `vtpNominationSubmission`.
      schema:
        type: string
        enum:
        - vtpNominationSubmission
      example: vtpNominationSubmission
  requestBodies:
    VTPNominationMessage:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/vtpNomination'
          examples:
            CatalogExamples:
              x-h2-generator:
                inject: all-valid-examples
  schemas:
    vtpNomination:
      x-h2-generator:
        inject: message-schema
