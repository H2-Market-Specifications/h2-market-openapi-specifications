openapi: 3.1.0
info:
  title: H2 Measurement Allocation API
  version: 1.0.0
  summary: API specification for transmitting allocated, network-point-specific measurements from the hydrogen market area manager to the balancing group responsible party.
  description: |-
    This OpenAPI specification describes the HTTP-based transmission of allocated measurements from the hydrogen market
    area manager (WMGV) to the balancing group responsible party (BKV) in the H2 market.

    The message contains preliminary or final measurements after their assignment to a balancing group. Values are
    transmitted per balancing group, network point, and flow direction in quarter-hourly or hourly granularity, and each
    value carries its quality and status. The transmission of measured data from the hydrogen grid operator to the
    hydrogen market area manager before allocation to a balancing group is not covered by this message; it is defined by
    the MEASUREMENT message.
x-h2-message:
  id: measurement-allocation
  businessName: Measurement Allocation
  type: ALLOCATION
  subType: Measurement
  messageVersion: '0.9'
  lifecycle: consultation
servers:
- url: /
  description: Local test environment
tags:
- name: MeasurementAllocations
  description: >-
    HTTP operations for transmitting allocated measurements from the hydrogen market area manager to the balancing group
    responsible party.
security:
- mtls: []
paths:
  /api/v1/measurement-allocations:
    post:
      tags:
      - MeasurementAllocations
      summary: Submit measurement allocations
      description: >-
        With this operation, the hydrogen market area manager (WMGV) transmits allocated preliminary or final
        measurements to the balancing group responsible party (BKV). The quantities are provided per balancing
        group, network point, and flow direction in quarter-hourly or hourly granularity, and each value states its
        quality and status.
      operationId: submitMeasurementAllocations
      parameters:
      - x-h2-generator:
          inject: common-component
          ref: '#/components/parameters/H2TransactionId'
      - x-h2-generator:
          inject: common-component
          ref: '#/components/parameters/H2InitialTransactionId'
      - x-h2-generator:
          inject: common-component
          ref: '#/components/parameters/H2MessageSender'
      - x-h2-generator:
          inject: common-component
          ref: '#/components/parameters/H2MessageReceiver'
      - $ref: '#/components/parameters/H2BusinessProcess'
      requestBody:
        $ref: '#/components/requestBodies/MeasurementAllocationMessage'
      responses:
        '200':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/TargetSuccess'
        '400':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/BadRequest'
        '401':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/Unauthorized'
        '403':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/Forbidden'
        '404':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/RouteNotFound'
        '405':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/MethodNotAllowed'
        '409':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/TargetConflict'
        '415':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/TargetUnprocessableEntity'
        '429':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/TooManyRequests'
        '502':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/BadGateway'
        '503':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/ServiceUnavailable'
        '504':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/GatewayTimeout'
components:
  securitySchemes:
    mtls:
      x-h2-generator:
        inject: common-component
        $ref: '#/components/securitySchemes/mtls'
  parameters:
    H2BusinessProcess:
      name: H2-Business-Process
      in: header
      required: true
      description: >-
        Identifies the business process to which this API call belongs. For this operation, the permitted value is
        `measurementAllocationSubmission`.
      schema:
        type: string
        enum:
        - measurementAllocationSubmission
      example: measurementAllocationSubmission
  requestBodies:
    MeasurementAllocationMessage:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/measurementAllocation'
          examples:
            CatalogExamples:
              x-h2-generator:
                inject: all-valid-examples
  schemas:
    measurementAllocation:
      x-h2-generator:
        inject: message-schema
