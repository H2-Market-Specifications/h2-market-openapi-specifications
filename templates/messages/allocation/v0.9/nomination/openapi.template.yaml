openapi: 3.1.0
info:
  title: H2 Nomination Allocation API
  version: 1.0.0
  summary: API specification for transmitting network-point-specific nomination allocations from hydrogen grid operators to the hydrogen market area manager and from the hydrogen market area manager to the balancing group responsible party.
  description: |-
    This OpenAPI specification describes the HTTP-based transmission of nomination allocations in the H2 market, both
    from hydrogen grid operators to the hydrogen market area manager (WMGV) and from the hydrogen market area manager to
    the balancing group responsible party (BKV).

    Hydrogen grid operator to hydrogen market area manager: the message represents the nomination quantities that are
    relevant for allocation at points subject to nomination. Values are transmitted in hourly granularity aggregated per
    balancing group, network point, and flow direction and reflect the latest valid nomination or renomination confirmed
    by the hydrogen grid operator. The hydrogen market area manager uses the data for balancing-group balancing and
    forecasting and derives quarter-hourly values where required by the continuous balancing process.

    Hydrogen market area manager to balancing group responsible party: the hydrogen market area manager provides the
    balancing group responsible party with the network-point-specific nomination allocations applied during the
    balancing process, for example at the virtual trading point, per balancing group, network point, and flow direction
    in hourly or quarter-hourly granularity.
x-h2-message:
  id: nomination-allocation
  businessName: Nomination Allocation
  type: ALLOCATION
  subType: Nomination
  messageVersion: '0.9'
  lifecycle: consultation
servers:
- url: /
  description: Local test environment
tags:
- name: NominationAllocations
  description: >-
    HTTP operations for transmitting nomination allocations from hydrogen grid operators to the hydrogen market area
    manager and from the hydrogen market area manager to the balancing group responsible party.
security:
- mtls: []
paths:
  /api/v1/nomination-allocations:
    post:
      tags:
      - NominationAllocations
      summary: Submit confirmed nomination allocations
      description: >-
        With this operation, nomination allocations are transmitted in one of two data flows. In the first flow, a
        hydrogen grid operator (WNB) transmits confirmed nomination allocations to the hydrogen market area manager
        (WMGV) for points subject to nomination. The transmitted quantities are aggregated across shipper codes at
        balancing-group level and provided per network point and flow direction in hourly granularity. They reflect
        the latest valid nomination or renomination confirmed by the hydrogen grid operator. The hydrogen market
        area manager uses these values as “allocated as nominated” input for balancing-group balancing and
        forecasting; where quarter-hourly values are required, the hourly quantities are split by the hydrogen
        market area manager. In the second flow, the hydrogen market area manager (WMGV) transmits the
        network-point-specific nomination allocations applied in the balancing process, for example at the virtual
        trading point, to the balancing group responsible party (BKV) in hourly or quarter-hourly granularity.
      operationId: submitNominationAllocations
      parameters:
      - x-h2-generator:
          inject: common-component
          ref: '#/components/parameters/H2TransactionId'
      - x-h2-generator:
          inject: common-component
          ref: '#/components/parameters/H2InitialTransactionId'
      - x-h2-generator:
          inject: common-component
          ref: '#/components/parameters/H2MessageSender'
      - x-h2-generator:
          inject: common-component
          ref: '#/components/parameters/H2MessageReceiver'
      - $ref: '#/components/parameters/H2BusinessProcess'
      requestBody:
        $ref: '#/components/requestBodies/NominationAllocationMessage'
      responses:
        '200':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/TargetSuccess'
        '400':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/BadRequest'
        '401':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/Unauthorized'
        '403':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/Forbidden'
        '404':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/RouteNotFound'
        '405':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/MethodNotAllowed'
        '409':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/TargetConflict'
        '415':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/TargetUnprocessableEntity'
        '429':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/TooManyRequests'
        '502':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/BadGateway'
        '503':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/ServiceUnavailable'
        '504':
          x-h2-generator:
            inject: common-component
            $ref: '#/components/responses/GatewayTimeout'
components:
  securitySchemes:
    mtls:
      x-h2-generator:
        inject: common-component
        $ref: '#/components/securitySchemes/mtls'
  parameters:
    H2BusinessProcess:
      name: H2-Business-Process
      in: header
      required: true
      description: >-
        Identifies the business process to which this API call belongs. For this operation, the permitted value is
        `nominationAllocationSubmission`.
      schema:
        type: string
        enum:
        - nominationAllocationSubmission
      example: nominationAllocationSubmission
  requestBodies:
    NominationAllocationMessage:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/nominationAllocation'
          examples:
            CatalogExamples:
              x-h2-generator:
                inject: all-valid-examples
  schemas:
    nominationAllocation:
      x-h2-generator:
        inject: message-schema
