openapi: 3.1.0
info:
  title: H2 Nomination Allocation API
  version: 1.0.0
  summary: API specification for transmitting network-point-specific nomination allocations from hydrogen grid operators to
    the hydrogen market area manager and from the hydrogen market area manager to the balancing group responsible party.
  description: 'This OpenAPI specification describes the HTTP-based transmission of nomination allocations in the H2 market,
    both

    from hydrogen grid operators to the hydrogen market area manager (WMGV) and from the hydrogen market area manager to

    the balancing group responsible party (BKV).


    Hydrogen grid operator to hydrogen market area manager: the message represents the nomination quantities that are

    relevant for allocation at points subject to nomination. Values are transmitted in hourly granularity aggregated per

    balancing group, network point, and flow direction and reflect the latest valid nomination or renomination confirmed

    by the hydrogen grid operator. The hydrogen market area manager uses the data for balancing-group balancing and

    forecasting and derives quarter-hourly values where required by the continuous balancing process.


    Hydrogen market area manager to balancing group responsible party: the hydrogen market area manager provides the

    balancing group responsible party with the network-point-specific nomination allocations applied during the

    balancing process, for example at the virtual trading point, per balancing group, network point, and flow direction

    in hourly or quarter-hourly granularity.'
x-h2-message:
  id: nomination-allocation
  businessName: Nomination Allocation
  type: ALLOCATION
  subType: Nomination
  messageVersion: '0.9'
  lifecycle: consultation
servers:
- url: /
  description: Local test environment
tags:
- name: NominationAllocations
  description: HTTP operations for transmitting nomination allocations from hydrogen grid operators to the hydrogen market
    area manager and from the hydrogen market area manager to the balancing group responsible party.
security:
- mtls: []
paths:
  /api/v1/nomination-allocations:
    post:
      tags:
      - NominationAllocations
      summary: Submit confirmed nomination allocations
      description: With this operation, nomination allocations are transmitted in one of two data flows. In the first flow,
        a hydrogen grid operator (WNB) transmits confirmed nomination allocations to the hydrogen market area manager (WMGV)
        for points subject to nomination. The transmitted quantities are aggregated across shipper codes at balancing-group
        level and provided per network point and flow direction in hourly granularity. They reflect the latest valid nomination
        or renomination confirmed by the hydrogen grid operator. The hydrogen market area manager uses these values as “allocated
        as nominated” input for balancing-group balancing and forecasting; where quarter-hourly values are required, the hourly
        quantities are split by the hydrogen market area manager. In the second flow, the hydrogen market area manager (WMGV)
        transmits the network-point-specific nomination allocations applied in the balancing process, for example at the virtual
        trading point, to the balancing group responsible party (BKV) in hourly or quarter-hourly granularity.
      operationId: submitNominationAllocations
      parameters:
      - name: H2-Transaction-Id
        in: header
        required: true
        description: Unique identifier of this HTTP request on the current communication leg, as UUID version 7. A new value
          is generated for every request, including every retry.
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 019dbe80-9b35-773d-8f14-7c778c8d71b1
      - name: H2-Initial-Transaction-Id
        in: header
        required: false
        description: 'Sent only with a retry: the H2-Transaction-Id of the first request of the same communication leg, as
          UUID version 7. A request that is not a retry must not contain this header. On a retry, this value is the effective
          transaction ID of the request.'
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 019dbe80-9b35-773d-8f14-7c778c8d71b1
      - name: H2-Message-Sender
        in: header
        required: true
        description: Market partner identifier of the sending market partner.
        schema:
          type: string
          pattern: ^\d{13}$
        example: '9700123456789'
      - name: H2-Message-Receiver
        in: header
        required: true
        description: Market partner identifier of the recipient of the current communication leg, for example the Data Hub
          on the leg from a market partner to the Data Hub. This is not necessarily the final business recipient of the message.
        schema:
          type: string
          pattern: ^\d{13}$
        example: '9700987654321'
      - $ref: '#/components/parameters/H2BusinessProcess'
      requestBody:
        $ref: '#/components/requestBodies/NominationAllocationMessage'
