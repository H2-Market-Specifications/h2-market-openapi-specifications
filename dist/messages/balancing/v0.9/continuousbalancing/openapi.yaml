openapi: 3.1.0
info:
  title: H2 Continuous Balancing API
  version: 1.0.0
  summary: API specification for transmitting continuous balancing figures from the hydrogen market area manager to the balancing
    group responsible party.
  description: 'This OpenAPI specification describes the HTTP-based transmission of balancing figures calculated by the hydrogen

    market area manager (WMGV) as part of continuous balancing in the H2 market.


    A message refers to one balancing group (internal account) and its cluster and contains balancing-number time series

    for the balancing-group balance (BGBalance, entry minus exit per interval) and the cumulative balancing-group

    balance (BGBalanceCumulative). The overall network status (OverallNetworkStatus) of the corresponding cluster can

    additionally be provided to the BKV as part of the continuous-balancing data. Where the receiving BKV is the

    equalizing BKV in a cooperative balancing relationship, the cumulative balance of the balancing group being balanced

    can additionally be transmitted as BGBalanceCumulativeExternal. Values are distinguished by the quality defined in

    the message schema and are updated according to the continuous-balancing cycle.'
x-h2-message:
  id: continuousbalancing-balancing
  businessName: Continuous Balancing
  type: BALANCING
  subType: ContinuousBalancing
  messageVersion: '0.9'
  lifecycle: consultation
servers:
- url: /
  description: Local test environment
tags:
- name: ContinuousBalancing
  description: HTTP operations for transmitting balancing figures calculated in the continuous balancing process.
security:
- mtls: []
paths:
  /api/v1/continuous-balancings:
    post:
      tags:
      - ContinuousBalancing
      summary: Submit continuous balancing figures
      description: With this operation, the hydrogen market area manager (WMGV) transmits the balancing figures calculated
        in the continuous balancing process to the balancing group responsible party. The message contains the balancing-group
        balance and the cumulative balancing-group balance for the relevant balancing group and can additionally provide the
        overall network status of the corresponding cluster. If the receiving BKV acts as the equalizing BKV in a cooperative
        balancing relationship, the cumulative balance of the balancing group being balanced is additionally provided. Preliminary
        and forecast values are updated in the continuous-balancing cycle, while values for a completed balancing period are
        closed according to their stated quality.
      operationId: submitContinuousBalancing
      parameters:
      - name: H2-Transaction-Id
        in: header
        required: true
        description: Unique identifier of this HTTP request on the current communication leg, as UUID version 7. A new value
          is generated for every request, including every retry.
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 019dbe80-9b35-773d-8f14-7c778c8d71b1
      - name: H2-Initial-Transaction-Id
        in: header
        required: false
        description: 'Sent only with a retry: the H2-Transaction-Id of the first request of the same communication leg, as
          UUID version 7. A request that is not a retry must not contain this header. On a retry, this value is the effective
          transaction ID of the request.'
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 019dbe80-9b35-773d-8f14-7c778c8d71b1
      - name: H2-Message-Sender
        in: header
        required: true
        description: Market partner identifier of the sending market partner.
        schema:
          type: string
          pattern: ^\d{13}$
        example: '9700123456789'
      - name: H2-Message-Receiver
        in: header
        required: true
        description: Market partner identifier of the recipient of the current communication leg, for example the Data Hub
          on the leg from a market partner to the Data Hub. This is not necessarily the final business recipient of the message.
        schema:
          type: string
          pattern: ^\d{13}$
        example: '9700987654321'
      - $ref: '#/components/parameters/H2BusinessProcess'
      requestBody:
        $ref: '#/components/requestBodies/ContinuousBalancingMessage'
      responses:
        '200':
          description: The market message was successfully processed and answered by the addressed target system.
          headers:
            H2-Transaction-Id:
              description: Newly generated identifier of this response, as UUID version 7. Present in every response with
                a JSON body.
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
              required: true
            H2-Reference-Id:
              description: 'Effective transaction ID of the answered request: its H2-Initial-Transaction-Id for a retry, otherwise
                its H2-Transaction-Id. Present in every response with a JSON body.'
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
              required: true
            H2-API-Version:
              description: Fully qualified version (`<MAJOR>.<MINOR>.<PATCH>`) of the answering API.
              schema:
                type: string
                pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
              example: 1.0.0
              required: true
            H2-Response-Origin:
              description: Origin of the response from the perspective of the interface.
              schema:
                type: string
                enum:
                - Gateway
                - TargetSystem
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  referenceNumber:
                    type: string
                  responseOrigin:
                    type: string
                    enum:
                    - TargetSystem
                  messageType:
                    type: string
                    enum:
                    - BALANCING
                  messageSubType:
                    type: string
                    enum:
                    - ContinuousBalancing
                  messageVersion:
                    type: string
                    enum:
                    - '0.9'
                  processedAt:
                    type: string
                    format: date-time
                required:
                - status
                - responseOrigin
              example:
                status: ok
                referenceNumber: ABC123456789
                responseOrigin: TargetSystem
                messageType: BALANCING
                messageSubType: ContinuousBalancing
                messageVersion: '0.9'
                processedAt: '2026-03-22T15:47:45Z'
