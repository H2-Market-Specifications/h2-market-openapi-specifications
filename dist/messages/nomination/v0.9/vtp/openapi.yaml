openapi: 3.1.0
info:
  title: H2 VTP Nomination API
  version: 1.0.0
  summary: API specification for submitting VTP nominations and renominations to the hydrogen market area manager for processing,
    matching where applicable, and allocation.
  description: 'This OpenAPI specification describes the HTTP-based submission of nominations and renominations at the virtual

    trading point (VTP/VHP) in the H2 market. Nominations are submitted to the hydrogen market area manager (WMGV) by

    the balancing group responsible party or by the hydrogen market area manager.


    For regular transfers between balancing groups, the balancing group responsible party submits a Double Sided

    Nomination to the hydrogen market area manager (WMGV). The hydrogen market area manager compares the corresponding

    nominations in an automated matching process. Equal quantities are confirmed, different same-direction quantities

    are matched using the lesser rule, and missing or directionally inconsistent counterpart nominations result in zero

    for the affected interval. The VTP process also permits Single Sided Nominations for specifically defined

    contractual or system processes; in those cases no corresponding nomination from another BKV is required, in

    particular for cooperative balancing and the return of difference quantities. Every renomination triggers renewed

    processing. The confirmed result is used for the VTP allocation and therefore enters the balancing-group

    calculation.'
x-h2-message:
  id: vtp-nomination
  businessName: VTP Nomination
  type: NOMINATION
  subType: VTP
  messageVersion: '0.9'
  lifecycle: consultation
servers:
- url: /
  description: Local test environment
tags:
- name: VTPNominations
  description: HTTP operations for submitting nominations and renominations at the virtual trading point.
security:
- mtls: []
paths:
  /api/v1/vtp-nominations:
    post:
      tags:
      - VTPNominations
      summary: Submit VTP nomination or renomination
      description: 'With this operation, the balancing group responsible party or the hydrogen market area manager submits
        a nomination or renomination at the virtual trading point (VTP/VHP) to the hydrogen market area manager (WMGV). Transfers
        between balancing groups are generally submitted as Double Sided Nominations (DSN), for which corresponding nominations
        are matched: equal quantities are confirmed, differing same-direction quantities are reduced according to the lesser
        rule, and missing or directionally inconsistent counter-nominations result in zero. For specifically defined contractual
        or system processes, Single Sided Nominations (SSN) are also permitted and do not require a corresponding nomination
        from another BKV; this applies in particular to cooperative balancing and the return of difference quantities. Each
        renomination triggers renewed processing, and the confirmed result is used for the VTP allocation in the affected
        balancing groups.'
      operationId: submitVTPNominations
      parameters:
      - name: H2-Transaction-Id
        in: header
        required: true
        description: Unique identifier of this HTTP request on the current communication leg, as UUID version 7. A new value
          is generated for every request, including every retry.
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 019dbe80-9b35-773d-8f14-7c778c8d71b1
      - name: H2-Initial-Transaction-Id
        in: header
        required: false
        description: 'Sent only with a retry: the H2-Transaction-Id of the first request of the same communication leg, as
          UUID version 7. A request that is not a retry must not contain this header. On a retry, this value is the effective
          transaction ID of the request.'
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 019dbe80-9b35-773d-8f14-7c778c8d71b1
      - name: H2-Message-Sender
        in: header
        required: true
        description: Market partner identifier of the sending market partner.
        schema:
          type: string
          pattern: ^\d{13}$
        example: '9700123456789'
      - name: H2-Message-Receiver
        in: header
        required: true
        description: Market partner identifier of the recipient of the current communication leg, for example the Data Hub
          on the leg from a market partner to the Data Hub. This is not necessarily the final business recipient of the message.
        schema:
          type: string
          pattern: ^\d{13}$
        example: '9700987654321'
      - $ref: '#/components/parameters/H2BusinessProcess'
      requestBody:
        $ref: '#/components/requestBodies/VTPNominationMessage'
