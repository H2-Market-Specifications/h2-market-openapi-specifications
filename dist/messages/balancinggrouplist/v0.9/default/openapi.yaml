openapi: 3.1.0
info:
  title: H2 Balancing Group List API
  version: 1.0.0
  summary: API specification for providing the current list of valid balancing groups from the hydrogen market area manager
    to hydrogen grid operators.
  description: 'This OpenAPI specification describes the HTTP-based provision of the balancing-group list in the H2 market.


    The hydrogen market area manager (WMGV) provides the hydrogen grid operators (WNB) with the current list of valid

    balancing groups. The message is used to communicate newly created balancing groups and changes to existing

    balancing group data. For each balancing group, the list contains the internal balancing group identifier, the

    assigned cluster, the balancing group''s validity period, and the responsible market partner including the market

    partner''s validity period.'
x-h2-message:
  id: default-balancinggrouplist
  businessName: Balancing Group List
  type: BALANCINGGROUPLIST
  subType: Default
  messageVersion: '0.9'
  lifecycle: consultation
servers:
- url: /
  description: Local test environment
tags:
- name: BalancingGroupLists
  description: HTTP operations for providing the current list of valid balancing groups from the hydrogen market area manager
    to hydrogen grid operators.
security:
- mtls: []
