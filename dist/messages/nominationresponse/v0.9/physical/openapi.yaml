openapi: 3.1.0
info:
  title: H2 Physical Nomination Response API
  version: 1.0.0
  summary: API specification for transmitting business confirmations for physical nominations and renominations from hydrogen
    grid operators to the nominating market participant.
  description: 'This OpenAPI specification describes the HTTP-based transmission of physical nomination confirmations in the
    H2

    market.


    The physical nomination process provides the nominating balancing group responsible party with business

    confirmations at different stages. After the nomination has been checked and any applicable capacity restrictions

    have been applied, the responsible matching partner communicates the internally processed quantity that will enter

    matching. After the matching process, the finally matched quantity is communicated as the effective nomination. The

    nomination response therefore represents business confirmation within the nomination process and is separate from a

    purely technical acknowledgement that the nomination message was received.'
x-h2-message:
  id: physical-nominationresponse
  businessName: Physical Nomination Response
  type: NOMINATIONRESPONSE
  subType: Physical
  messageVersion: '0.9'
  lifecycle: consultation
servers:
- url: /
  description: Local test environment
tags:
- name: PhysicalNominationResponses
  description: HTTP operations for transmitting the business confirmation of physical nominations and renominations.
security:
- mtls: []
paths:
  /api/v1/physical-nominationresponses:
    post:
      tags:
      - PhysicalNominationResponses
      summary: Submit physical nomination confirmation
      description: With this operation, a hydrogen grid operator (WNB) transmits the business confirmation of a physical nomination
        or renomination to the nominating balancing group responsible party. Depending on the stage of the physical nomination
        process, the response can communicate the quantity processed by the matching partner before matching—the quantity
        that will enter the matching process—or the finally confirmed quantity after matching. Capacity-related reductions
        or other applicable nomination checks are reflected in the relevant confirmed quantity. This business confirmation
        is distinct from the technical HTTP acknowledgement of the original nomination submission.
      operationId: submitPhysicalNominationResponses
      parameters:
      - name: H2-Transaction-Id
        in: header
        required: true
        description: Unique identifier of this HTTP request on the current communication leg, as UUID version 7. A new value
          is generated for every request, including every retry.
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 019dbe80-9b35-773d-8f14-7c778c8d71b1
      - name: H2-Initial-Transaction-Id
        in: header
        required: false
        description: 'Sent only with a retry: the H2-Transaction-Id of the first request of the same communication leg, as
          UUID version 7. A request that is not a retry must not contain this header. On a retry, this value is the effective
          transaction ID of the request.'
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 019dbe80-9b35-773d-8f14-7c778c8d71b1
      - name: H2-Message-Sender
        in: header
        required: true
        description: Market partner identifier of the sending market partner.
        schema:
          type: string
          pattern: ^\d{13}$
        example: '9700123456789'
      - name: H2-Message-Receiver
        in: header
        required: true
        description: Market partner identifier of the recipient of the current communication leg, for example the Data Hub
          on the leg from a market partner to the Data Hub. This is not necessarily the final business recipient of the message.
        schema:
          type: string
          pattern: ^\d{13}$
        example: '9700987654321'
      - $ref: '#/components/parameters/H2BusinessProcess'
      requestBody:
        $ref: '#/components/requestBodies/PhysicalNominationResponseMessage'
      responses:
        '200':
          description: The market message was successfully processed and answered by the addressed target system.
          headers:
            H2-Transaction-Id:
              description: Newly generated identifier of this response, as UUID version 7. Present in every response with
                a JSON body.
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
              required: true
            H2-Reference-Id:
              description: 'Effective transaction ID of the answered request: its H2-Initial-Transaction-Id for a retry, otherwise
                its H2-Transaction-Id. Present in every response with a JSON body.'
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
              required: true
            H2-API-Version:
              description: Fully qualified version (`<MAJOR>.<MINOR>.<PATCH>`) of the answering API.
              schema:
                type: string
                pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
              example: 1.0.0
              required: true
            H2-Response-Origin:
              description: Origin of the response from the perspective of the interface.
              schema:
                type: string
                enum:
                - Gateway
                - TargetSystem
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  referenceNumber:
                    type: string
                  responseOrigin:
                    type: string
                    enum:
                    - TargetSystem
                  messageType:
                    type: string
                    enum:
                    - NOMINATIONRESPONSE
                  messageSubType:
                    type: string
                    enum:
                    - Physical
                  messageVersion:
                    type: string
                    enum:
                    - '0.9'
                  processedAt:
                    type: string
                    format: date-time
                required:
                - status
                - responseOrigin
              example:
                status: ok
                referenceNumber: ABC123456789
                responseOrigin: TargetSystem
                messageType: NOMINATIONRESPONSE
                messageSubType: Physical
                messageVersion: '0.9'
                processedAt: '2026-03-22T15:47:45Z'
