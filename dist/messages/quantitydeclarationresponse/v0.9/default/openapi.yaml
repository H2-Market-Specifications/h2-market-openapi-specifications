              description: Newly generated identifier of this response, as UUID version 7. Present in every response with
                a JSON body.
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
              required: true
            H2-Reference-Id:
              description: 'Effective transaction ID of the answered request: its H2-Initial-Transaction-Id for a retry, otherwise
                its H2-Transaction-Id. Present in every response with a JSON body.'
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
              required: true
            H2-API-Version:
              description: Fully qualified version (`<MAJOR>.<MINOR>.<PATCH>`) of the answering API.
              schema:
                type: string
                pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
              example: 1.0.0
              required: true
            H2-Response-Origin:
              description: Origin of the response from the perspective of the interface.
              schema:
                type: string
                enum:
                - Gateway
                - TargetSystem
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  referenceNumber:
                    type: string
                  responseOrigin:
                    type: string
                    enum:
                    - TargetSystem
