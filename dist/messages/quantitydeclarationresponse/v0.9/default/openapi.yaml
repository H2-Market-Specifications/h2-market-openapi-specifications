openapi: 3.1.0
info:
  title: H2 Quantity Declaration Response API
  version: 1.0.0
  summary: API specification for transmitting quantity declaration responses from hydrogen grid operators to balancing group
    responsible parties.
  description: 'This OpenAPI specification describes the HTTP-based transmission of quantity declaration responses in the
    H2 market.


    The hydrogen grid operator (WNB) returns the business result of the quantity-declaration check. The response

    represents the latest quantity submitted by the BKV, the quantity confirmed by the WNB, and the applicable booked

    capacity. Each confirmed hourly value carries the applicable status and indicates whether the confirmed quantity is

    a dispatch instruction. This allows the response to distinguish an unchanged confirmation of the requested quantity,

    a reduction to the available capacity because the requested quantity exceeds the available or booked capacity, and a

    reduction or interruption because of a supply bottleneck; if both a capacity exceedance and a supply bottleneck

    apply, the supply bottleneck takes precedence.'
x-h2-message:
  id: default-quantitydeclarationresponse
  businessName: Quantity Declaration Response
  type: QUANTITYDECLARATIONRESPONSE
  subType: Default
  messageVersion: '0.9'
  lifecycle: consultation
servers:
- url: /
  description: Local test environment
tags:
- name: QuantityDeclarationResponses
  description: HTTP operations for transmitting quantity declaration responses from hydrogen grid operators to balancing group
    responsible parties.
security:
- mtls: []
paths:
  /api/v1/quantitydeclarationresponses:
    post:
      tags:
      - QuantityDeclarationResponses
      summary: Submit quantity declaration response
      description: 'With this operation, a hydrogen grid operator (WNB) transmits the business response to a quantity declaration
        or adjustment for the relevant network point and balancing group responsible party. The response contains the latest
        quantity submitted by the BKV, the quantity confirmed by the WNB and the applicable booked capacity. For each confirmed
        hourly quantity, the response also indicates whether it is to be observed as a dispatch instruction and provides the
        applicable business status: the requested quantity is confirmed as submitted, the requested quantity exceeds the available
        or booked capacity, or the quantity was reduced or interrupted because of a supply bottleneck.'
      operationId: submitQuantityDeclarationResponses
      parameters:
      - name: H2-Transaction-Id
        in: header
        required: true
        description: Unique identifier of this HTTP request on the current communication leg, as UUID version 7. A new value
          is generated for every request, including every retry.
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 019dbe80-9b35-773d-8f14-7c778c8d71b1
      - name: H2-Initial-Transaction-Id
        in: header
        required: false
        description: 'Sent only with a retry: the H2-Transaction-Id of the first request of the same communication leg, as
          UUID version 7. A request that is not a retry must not contain this header. On a retry, this value is the effective
          transaction ID of the request.'
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 019dbe80-9b35-773d-8f14-7c778c8d71b1
      - name: H2-Message-Sender
        in: header
        required: true
        description: Market partner identifier of the sending market partner.
        schema:
          type: string
          pattern: ^\d{13}$
        example: '9700123456789'
      - name: H2-Message-Receiver
        in: header
        required: true
        description: Market partner identifier of the recipient of the current communication leg, for example the Data Hub
          on the leg from a market partner to the Data Hub. This is not necessarily the final business recipient of the message.
        schema:
          type: string
          pattern: ^\d{13}$
        example: '9700987654321'
      - $ref: '#/components/parameters/H2BusinessProcess'
      requestBody:
        $ref: '#/components/requestBodies/QuantityDeclarationResponseMessage'
      responses:
        '200':
          description: The market message was successfully processed and answered by the addressed target system.
